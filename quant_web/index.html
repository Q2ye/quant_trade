<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>一念量化</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      }

      body {
        background: #080C16;
        color: #EBEDF5;
        overflow: hidden;
        height: 100vh;
      }

      /* 初始加载动画 — 深海蓝主题 */
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: radial-gradient(ellipse 80% 50% at 50% 30%, rgba(68,138,255,0.08), transparent),
                    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(64,196,255,0.04), transparent),
                    #080C16;
        z-index: 1000;
        transition: opacity 0.6s ease;
      }

      .loading-logo {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .loading-logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        animation: logoZoom 3s ease-in-out infinite;
      }

      .loading-text {
        position: relative;
        z-index: 1;
        font-size: 18px;
        font-weight: 500;
        margin-bottom: 24px;
        color: #8898B8;
        letter-spacing: 4px;
      }

      .loading-progress {
        position: relative;
        z-index: 1;
        width: 280px;
        height: 2px;
        background: rgba(68, 138, 255, 0.15);
        border-radius: 1px;
        overflow: hidden;
      }

      .progress-bar {
        height: 100%;
        width: 30%;
        background: linear-gradient(90deg, transparent, #448AFF, transparent);
        border-radius: 1px;
        animation: scanLine 1.5s ease-in-out infinite;
      }

      @keyframes logoZoom {
        0%   { transform: scale(1.00); }
        50%  { transform: scale(1.04); }
        100% { transform: scale(1.00); }
      }

      @keyframes scanLine {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(340px); }
      }

      /* Vue应用加载完成后隐藏加载动画 */
      #app-loading.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      /* Vue应用容器 */
      #app {
        opacity: 0;
        transition: opacity 0.5s ease;
        height: 100vh;
      }

      #app.visible {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <!-- 初始加载动画 -->
    <div id="app-loading">
      <div class="loading-logo">
          <img src="/logo-heng.svg"  alt="一念量化" style="width:100vw;height:100vh;object-fit:fill;" />
      </div>
      <div class="loading-text">一念量化</div>
      <div class="loading-progress">
        <div class="progress-bar"></div>
      </div>
    </div>

    <!-- Vue应用挂载点 -->
    <div id="app"></div>

    <!-- 配置数据 -->
    <script type="application/json" id="app-config">
      {
        "apiBase": "https://api.quant-platform.com/v1",
        "dataSource": "Tushare",
        "defaultTheme": "dark",
        "enableAnalytics": true
      }
    </script>

    <!-- 主应用脚本 -->
    <script src="./src/main.ts" type="module"></script>

    <script>
      // 监听Vue应用加载完成事件
      document.addEventListener("vue-app-ready", function () {
        // 最短展示时间 2.5s，让用户看清 logo 动画
        setTimeout(() => {
          const loadingElement = document.getElementById("app-loading");
          const appElement = document.getElementById("app");

          // 添加淡出效果
          loadingElement.classList.add("fade-out");

          // 显示Vue应用
          setTimeout(() => {
            appElement.classList.add("visible");
          }, 500);
        }, 1500);
      });
    </script>
  </body>
</html>
