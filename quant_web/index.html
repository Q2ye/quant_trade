<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>一念量化</title>

    <style>
      :root {
        --vh-full: calc(100vh / 0.8); /* 125vh — zoom 补偿 */
      }
      html {
        zoom: 0.8;
        background-color: #080c16;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      }

      body {
        background: #080c16;
        color: #ebedf5;
        overflow: hidden;
        min-height: var(--vh-full);
      }

      /* 初始加载动画 — 深海蓝主题 */
      #app-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 125vw; /* 100vw / 0.8 — 补偿 zoom */
        height: 125vh; /* 100vh / 0.8 — 补偿 zoom */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background:
          radial-gradient(
            ellipse 80% 50% at 50% 30%,
            rgba(68, 138, 255, 0.08),
            transparent
          ),
          radial-gradient(
            ellipse 60% 40% at 80% 80%,
            rgba(64, 196, 255, 0.04),
            transparent
          ),
          #080c16;
        z-index: 1000;
        transition: opacity 0.6s ease;
      }

      .loading-logo {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        transition:
          transform 0.5s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.5s ease;
      }

      .loading-logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        animation: logoBreathe 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      /* Logo 背后的脉冲光晕 */
      .logo-glow {
        position: absolute;
        width: 360px;
        height: 360px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(68, 138, 255, 0.12) 0%,
          transparent 70%
        );
        animation: glowPulse 4s ease-in-out infinite;
        pointer-events: none;
      }

      @keyframes logoBreathe {
        0% {
          transform: scale(1);
        }
        35% {
          transform: scale(1.05);
        } /* 快吸 */
        55% {
          transform: scale(1.05);
        } /* 屏息 */
        100% {
          transform: scale(1);
        } /* 慢呼 */
      }

      @keyframes glowPulse {
        0%,
        100% {
          opacity: 0.25;
          transform: scale(0.85);
        }
        50% {
          opacity: 0.65;
          transform: scale(1.1);
        }
      }

      /* 退出过渡 — logo 收缩 + 淡出 */
      #app-loading.exit-anim .loading-logo {
        transform: scale(0.85);
        opacity: 0;
      }

      /* Vue应用加载完成后隐藏加载动画 */
      #app-loading.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      /* Vue应用容器 */
      #app {
        opacity: 0;
        transition: opacity 0.5s ease;
        height: var(--vh-full);
      }

      #app.visible {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <!-- 初始加载动画 -->
    <div id="app-loading">
      <div class="loading-logo">
        <div class="logo-glow"></div>
        <img
          src="/logo-heng.svg"
          alt="一念量化"
          style="width: 100%; height: 100%; object-fit: fill"
        />
      </div>
    </div>

    <!-- Vue应用挂载点 -->
    <div id="app"></div>

    <!-- 配置数据 -->
    <script type="application/json" id="app-config">
      {
        "apiBase": "https://api.quant-platform.com/v1",
        "dataSource": "Tushare",
        "defaultTheme": "dark",
        "enableAnalytics": true
      }
    </script>

    <!-- 主应用脚本 -->
    <script src="./src/main.ts" type="module"></script>

    <script>
      // 监听Vue应用加载完成事件
      document.addEventListener("vue-app-ready", function () {
        // 最短展示时间，让用户看清 logo 动画
        const minDisplay = 2000; // 最少展示 2s
        const elapsed = performance.now();
        const delay = Math.max(0, minDisplay - elapsed);

        setTimeout(() => {
          const loadingElement = document.getElementById("app-loading");
          const appElement = document.getElementById("app");

          // 第一步：logo 收缩 + 文字/点淡出 (0.5s)
          loadingElement.classList.add("exit-anim");

          // 第二步：整体遮罩淡出，应用淡入 (0.6s)
          setTimeout(() => {
            loadingElement.classList.add("fade-out");
            appElement.classList.add("visible");
          }, 500);
        }, delay);
      });
    </script>
  </body>
</html>
