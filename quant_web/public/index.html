<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="专业级A股量化交易平台">
  <title>A股量化交易平台</title>

  <!-- Favicon -->
  <link rel="icon" href="./favicon.ico" type="image/x-icon">

  <!-- 预加载关键资源 -->
  <link rel="preload" href="./assets/fonts/QuantFont.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./src/main.css" as="style">
  <link rel="preload" href="./src/main.js" as="script">

  <!-- 主题配置 -->
  <link rel="stylesheet" href="./config/theme.json" id="theme-stylesheet">

  <!-- 全局样式 -->
  <link rel="stylesheet" href="./assets/scss/global.scss">

  <!-- 移动端适配 -->
  <meta name="theme-color" content="#1e272c">
</head>
<body>
  <div id="app">
    <!-- Vue应用挂载点 -->
    <div class="app-loading">
      <div class="loading-logo">
        <svg width="80" height="80" viewBox="0 0 100 100">
          <path fill="#2196F3" d="M50,5A45,45 0 1,0 95,50A45,45 0 0,0 50,5Z"/>
          <path fill="#FFC107" d="M50,20L65,45L50,70L35,45Z"/>
        </svg>
      </div>
      <div class="loading-text">量化引擎启动中...</div>
      <div class="loading-progress">
        <div class="progress-bar"></div>
      </div>
    </div>
  </div>

  <!-- 环境变量配置 -->
  <script type="application/json" id="app-config">
    {
      "apiBase": "https://api.quant-platform.com/v1",
      "dataSource": "Tushare",
      "defaultTheme": "dark",
      "enableAnalytics": true
    }
  </script>

  <!-- 主应用脚本 -->
  <script src="./src/main.js" type="module"></script>

  <!-- 第三方库 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.0/dist/chart.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.3.0/dist/echarts.min.js"></script>

  <!-- 数据监控 -->
  <script>
    // 性能监控
    window.addEventListener('load', () => {
      const perfData = {
        loadTime: performance.timing.loadEventEnd - performance.timing.navigationStart,
        dns: performance.timing.domainLookupEnd - performance.timing.domainLookupStart,
        tcp: performance.timing.connectEnd - performance.timing.connectStart,
        request: performance.timing.responseStart - performance.timing.requestStart,
        response: performance.timing.responseEnd - performance.timing.responseStart,
        domReady: performance.timing.domContentLoadedEventEnd - performance.timing.navigationStart,
        interactive: performance.timing.domInteractive - performance.timing.navigationStart
      };

      if (window.quantAnalytics) {
        window.quantAnalytics.track('PERFORMANCE_METRICS', perfData);
      }
    });
  </script>
</body>
</html>
