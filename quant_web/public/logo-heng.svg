<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1706 732" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
    <defs>
        <!-- 背景渐变 -->
        <radialGradient id="voidBg" cx="50%" cy="55%" r="75%">
            <stop offset="0%" stop-color="#121a26"/>
            <stop offset="25%" stop-color="#0d131c"/>
            <stop offset="55%" stop-color="#080c12"/>
            <stop offset="100%" stop-color="#04070a"/>
        </radialGradient>

        <!-- 原点主光晕 -->
        <radialGradient id="originCore" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
            <stop offset="8%" stop-color="#e8f7ff" stop-opacity="0.9"/>
            <stop offset="25%" stop-color="#7ee0ff" stop-opacity="0.5"/>
            <stop offset="50%" stop-color="#3cb8e0" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#121a26" stop-opacity="0"/>
        </radialGradient>

        <!-- 次级柔光 -->
        <radialGradient id="originSoft" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#c8f0ff" stop-opacity="0.25"/>
            <stop offset="50%" stop-color="#5ce0ff" stop-opacity="0.06"/>
            <stop offset="100%" stop-color="#121a26" stop-opacity="0"/>
        </radialGradient>

        <!-- 弧线渐变 -->
        <linearGradient id="arcGrad1" x1="50%" y1="55%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#8ed8f0" stop-opacity="0.65"/>
            <stop offset="40%" stop-color="#5cb8d8" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#5ce0ff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="arcGrad2" x1="50%" y1="55%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#a0c8e8" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#a0c8ff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="arcGrad3" x1="50%" y1="55%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8ed8f0" stop-opacity="0.6"/>
            <stop offset="100%" stop-color="#5ce0ff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="arcGrad4" x1="50%" y1="55%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#a0c8e8" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#a0c8ff" stop-opacity="0"/>
        </linearGradient>
    </defs>

    <!-- 背景 -->
    <rect width="1706" height="732" fill="url(#voidBg)"/>

    <!-- 星尘噪点 -->
    <g opacity="0.1">
        <circle cx="200" cy="100" r="1.5" fill="#fff"/>
        <circle cx="800" cy="200" r="1.2" fill="#fff"/>
        <circle cx="1200" cy="80" r="1.8" fill="#fff"/>
        <circle cx="1600" cy="300" r="1.0" fill="#fff"/>
        <circle cx="400" cy="500" r="1.6" fill="#fff"/>
        <circle cx="1000" cy="600" r="1.4" fill="#fff"/>
        <circle cx="1400" cy="650" r="1.2" fill="#fff"/>
        <circle cx="300" cy="700" r="1.5" fill="#fff"/>
        <circle cx="50" cy="400" r="1.0" fill="#fff"/>
        <circle cx="1650" cy="100" r="0.8" fill="#fff"/>
        <circle cx="900" cy="350" r="1.1" fill="#fff"/>
    </g>

    <!-- ===== 原点区域 ===== -->
    <!-- 柔光底圈 -->
    <circle cx="600" cy="366" r="180" fill="url(#originSoft)"/>
    <!-- 主光晕 -->
    <circle cx="600" cy="366" r="90" fill="url(#originCore)"/>
    <!-- 核心亮点 -->
    <circle cx="600" cy="366" r="5" fill="#ffffff" opacity="0.9"/>
    <circle cx="600" cy="366" r="10" fill="#ffffff" opacity="0.4"/>

    <!-- ===== 万象生发：弧线与数据流 ===== -->
    <!-- 右上方扩散 -->
    <path d="M 600 366 Q 650 250 800 150 Q 950 50 1150 20" fill="none" stroke="url(#arcGrad1)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 600 366 Q 700 300 850 220 Q 1000 140 1200 100" fill="none" stroke="url(#arcGrad1)" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

    <!-- 左上方扩散 -->
    <path d="M 600 366 Q 550 250 400 150 Q 250 50 50 20" fill="none" stroke="url(#arcGrad2)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 600 366 Q 500 300 350 220 Q 200 140 0 100" fill="none" stroke="url(#arcGrad2)" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

    <!-- 右下方扩散 -->
    <path d="M 600 366 Q 650 482 800 582 Q 950 682 1150 712" fill="none" stroke="url(#arcGrad3)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 600 366 Q 700 432 850 512 Q 1000 592 1200 632" fill="none" stroke="url(#arcGrad3)" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

    <!-- 左下方扩散 -->
    <path d="M 600 366 Q 550 482 400 582 Q 250 682 50 712" fill="none" stroke="url(#arcGrad4)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 600 366 Q 500 432 350 512 Q 200 592 0 632" fill="none" stroke="url(#arcGrad4)" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

    <!-- 竖直方向微弱扩散 -->
    <path d="M 600 366 Q 605 200 605 40" fill="none" stroke="url(#arcGrad1)" stroke-width="1.5" opacity="0.4"/>
    <path d="M 600 366 Q 595 532 595 692" fill="none" stroke="url(#arcGrad3)" stroke-width="1.5" opacity="0.4"/>

    <!-- ===== 同心圆涟漪 ===== -->
    <ellipse cx="600" cy="366" rx="300" ry="160" fill="none" stroke="#5ce0ff" stroke-width="0.8" opacity="0.25"/>
    <ellipse cx="600" cy="366" rx="600" ry="320" fill="none" stroke="#5ce0ff" stroke-width="0.6" opacity="0.15"/>
    <ellipse cx="600" cy="366" rx="900" ry="480" fill="none" stroke="#5ce0ff" stroke-width="0.4" opacity="0.08"/>

    <!-- ===== 信号点：微弱异动 ===== -->
    <g opacity="0.6">
        <circle cx="850" cy="120" r="3.5" fill="#8ed8f0"/>
        <circle cx="1150" cy="80" r="2.5" fill="#a0d8f0"/>
        <circle cx="750" cy="600" r="4.0" fill="#8ed8f0"/>
        <circle cx="1100" cy="680" r="3.0" fill="#a0d8f0"/>
        <circle cx="350" cy="100" r="3.0" fill="#a0c8e8"/>
        <circle cx="150" cy="250" r="4.0" fill="#a0c8e8"/>
        <circle cx="450" cy="650" r="3.5" fill="#a0c8e8"/>
        <circle cx="200" cy="550" r="2.5" fill="#a0c8e8"/>
        <circle cx="1400" cy="200" r="3.0" fill="#8ed8f0"/>
        <circle cx="1500" cy="500" r="3.5" fill="#8ed8f0"/>
        <circle cx="1600" cy="150" r="2.0" fill="#a0d8f0"/>
        <circle cx="1600" cy="600" r="2.5" fill="#a0d8f0"/>
    </g>

    <!-- ===== 左下角文字 ===== -->
    <g opacity="0.95">
        <text x="120" y="620" font-family="'Noto Serif SC', 'Songti SC', 'STSong', serif" font-size="36" font-weight="400" fill="#8898a8" letter-spacing="8">复</text>
        <text x="120" y="660" font-family="'Noto Serif SC', 'Songti SC', 'STSong', serif" font-size="22" font-weight="300" fill="#6a7a8a" letter-spacing="6">一阳来复</text>
        <text x="120" y="690" font-family="'Noto Serif SC', 'Songti SC', 'STSong', serif" font-size="16" font-weight="300" fill="#556678" letter-spacing="4">天地之心</text>
    </g>
</svg>