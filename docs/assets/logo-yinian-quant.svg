<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <!-- 背景：更深的虚空，中心微带靛蓝（破晓前的天色） -->
    <radialGradient id="voidBg" cx="50%" cy="55%" r="80%">
      <stop offset="0%" stop-color="#16222f"/>
      <stop offset="30%" stop-color="#0d1520"/>
      <stop offset="65%" stop-color="#060a12"/>
      <stop offset="100%" stop-color="#020409"/>
    </radialGradient>

    <!-- 一念光晕（一阳/一念，光之原点） -->
    <radialGradient id="originCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="14%" stop-color="#e8f7ff" stop-opacity="0.8"/>
      <stop offset="38%" stop-color="#7ee0ff" stop-opacity="0.35"/>
      <stop offset="62%" stop-color="#3cb8e0" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0d1520" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="originSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8f0ff" stop-opacity="0.2"/>
      <stop offset="55%" stop-color="#5ce0ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0d1520" stop-opacity="0"/>
    </radialGradient>

    <!-- 势：升腾光弧（右向动量倾，自阳弧向虚空衰减） -->
    <linearGradient id="rayC" gradientUnits="userSpaceOnUse" x1="200" y1="264" x2="206" y2="84">
      <stop offset="0%" stop-color="#8ce8ff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#5cb8d8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5ce0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rayR" gradientUnits="userSpaceOnUse" x1="200" y1="264" x2="288" y2="110">
      <stop offset="0%" stop-color="#8ce8ff" stop-opacity="0.65"/>
      <stop offset="55%" stop-color="#5cb8d8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#5ce0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rayL" gradientUnits="userSpaceOnUse" x1="200" y1="264" x2="144" y2="150">
      <stop offset="0%" stop-color="#8ce8ff" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#5cb8d8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5ce0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rayR2" gradientUnits="userSpaceOnUse" x1="200" y1="264" x2="326" y2="146">
      <stop offset="0%" stop-color="#8ce8ff" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#5cb8d8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#5ce0ff" stop-opacity="0"/>
    </linearGradient>

    <!-- 阳弧辉光（拱门基座 + 文字"一"共用此签名光效） -->
    <filter id="glowStrong" x="-40%" y="-200%" width="180%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSoft" x="-40%" y="-300%" width="180%" height="700%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="glowBar" x="-60%" y="-300%" width="220%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 虚空背景 -->
  <rect width="400" height="400" fill="url(#voidBg)"/>

  <!-- 极细微噪点 -->
  <g opacity="0.07">
    <circle cx="52" cy="82" r="0.6" fill="#ffffff"/>
    <circle cx="122" cy="42" r="0.5" fill="#ffffff"/>
    <circle cx="300" cy="56" r="0.7" fill="#ffffff"/>
    <circle cx="352" cy="116" r="0.4" fill="#ffffff"/>
    <circle cx="72" cy="332" r="0.6" fill="#ffffff"/>
    <circle cx="360" cy="322" r="0.5" fill="#ffffff"/>
    <circle cx="188" cy="28" r="0.4" fill="#ffffff"/>
    <circle cx="252" cy="372" r="0.5" fill="#ffffff"/>
  </g>

  <!-- ========== 复（骨）：同心涟漪，周期为界 ========== -->
  <ellipse cx="200" cy="262" rx="105" ry="84" fill="none" stroke="#5ce0ff" stroke-width="0.5" opacity="0.22"/>
  <ellipse cx="200" cy="262" rx="190" ry="150" fill="none" stroke="#5ce0ff" stroke-width="0.35" opacity="0.1"/>

  <!-- ========== 一念（心）：光之原点，拱门基座 ========== -->
  <circle cx="200" cy="262" r="80" fill="url(#originSoft)"/>
  <circle cx="200" cy="262" r="44" fill="url(#originCore)"/>

  <!-- ========== 复（骨）：拱门卦象 —— 五阴断弧穹顶，一阳居下 ========== -->
  <!-- 阴爻 × 5：断弧自下而上渐隐，穹顶升高 -->
  <g fill="none" stroke="#5ce0ff" stroke-width="1.3" stroke-linecap="round">
    <!-- 第6爻（顶）：最淡 -->
    <g opacity="0.30">
      <path d="M 150 174 Q 172 126 194 174"/>
      <path d="M 206 174 Q 228 126 250 174"/>
    </g>
    <!-- 第5爻 -->
    <g opacity="0.38">
      <path d="M 150 196 Q 172 148 194 196"/>
      <path d="M 206 196 Q 228 148 250 196"/>
    </g>
    <!-- 第4爻 -->
    <g opacity="0.46">
      <path d="M 150 218 Q 172 170 194 218"/>
      <path d="M 206 218 Q 228 170 250 218"/>
    </g>
    <!-- 第3爻 -->
    <g opacity="0.55">
      <path d="M 150 240 Q 172 192 194 240"/>
      <path d="M 206 240 Q 228 192 250 240"/>
    </g>
    <!-- 第2爻 -->
    <g opacity="0.66">
      <path d="M 150 262 Q 172 214 194 262"/>
      <path d="M 206 262 Q 228 214 250 262"/>
    </g>
  </g>
  <!-- 初爻：阳爻 —— 底部完整发光弧，一念既起，一阳来复 -->
  <path d="M 150 286 Q 200 234 250 286" fill="none" stroke="#3cb8e0" stroke-width="7" stroke-linecap="round" opacity="0.5" filter="url(#glowSoft)"/>
  <path d="M 150 286 Q 200 234 250 286" fill="none" stroke="#7ee0ff" stroke-width="3.2" stroke-linecap="round" opacity="0.85" filter="url(#glowStrong)"/>
  <path d="M 150 286 Q 200 234 250 286" fill="none" stroke="#ffffff" stroke-width="2.0" stroke-linecap="round"/>

  <!-- ========== 势（气）：升腾光弧，穿过断口，右向动量 ========== -->
  <!-- 中央光柱（微右倾），恰好穿过阴弧中缝 -->
  <path d="M 200 264 C 202 214, 204 152, 206 84" fill="none" stroke="url(#rayC)" stroke-linecap="round" stroke-width="1.4"/>
  <!-- 右侧主势弧（长而强） -->
  <path d="M 200 264 C 228 218, 260 172, 288 110" fill="none" stroke="url(#rayR)" stroke-linecap="round" stroke-width="1.5"/>
  <!-- 左侧收敛弧（短而弱） -->
  <path d="M 200 264 C 178 228, 160 192, 144 150" fill="none" stroke="url(#rayL)" stroke-linecap="round" stroke-width="0.9"/>
  <!-- 最右远势弧（极淡） -->
  <path d="M 200 264 C 244 226, 286 190, 326 146" fill="none" stroke="url(#rayR2)" stroke-linecap="round" stroke-width="0.8"/>

  <!-- ========== 信号点：沿势弧的爬升轨迹（读作上涨） ========== -->
  <g>
    <circle cx="206" cy="150" r="1.0" fill="#8ed8f0" opacity="0.5"/>
    <circle cx="210" cy="110" r="1.3" fill="#c8f0ff" opacity="0.7"/>
    <circle cx="252" cy="150" r="0.9" fill="#a0d8f0" opacity="0.5"/>
    <circle cx="282" cy="120" r="1.2" fill="#c8f0ff" opacity="0.6"/>
    <circle cx="300" cy="154" r="0.85" fill="#8ed8f0" opacity="0.45"/>
    <circle cx="156" cy="172" r="0.8" fill="#a0d8f0" opacity="0.4"/>
    <circle cx="136" cy="214" r="0.75" fill="#8ed8f0" opacity="0.4"/>
    <circle cx="64" cy="118" r="1.4" fill="#c8f0ff" opacity="0.6"/>
    <circle cx="336" cy="124" r="1.1" fill="#a0d8f0" opacity="0.45"/>
    <circle cx="172" cy="74" r="0.7" fill="#8ed8f0" opacity="0.4"/>
    <circle cx="244" cy="66" r="0.9" fill="#a0d8f0" opacity="0.45"/>
    <circle cx="50" cy="224" r="0.9" fill="#a0c8e8" opacity="0.45"/>
    <circle cx="350" cy="224" r="0.9" fill="#a0c8e8" opacity="0.45"/>
    <circle cx="252" cy="318" r="0.85" fill="#a0d8f0" opacity="0.4"/>
  </g>

  <!-- ========== 文字：一念 / 乘势而为 · 不远而复 ========== -->
  <g font-family="'Noto Serif SC','Songti SC','STSong',serif">
    <!-- 主标：一念 —— "一"字即阳爻（一 = 一阳 = 一念） -->
    <rect x="34" y="334.5" width="24" height="5" rx="2.5" fill="#3cb8e0" opacity="0.5" filter="url(#glowSoft)"/>
    <rect x="34" y="334.5" width="24" height="5" rx="2.5" fill="#7ee0ff" opacity="0.8" filter="url(#glowBar)"/>
    <rect x="34" y="334.5" width="24" height="5" rx="2.5" fill="#ffffff"/>
    <text x="66" y="348" font-size="26" font-weight="500" fill="#c6d8e2" letter-spacing="2">念</text>
    <!-- 副题：攻守兼备 —— 攻乘其势，守不远复 -->
    <text x="34" y="372" font-size="10.5" font-weight="400" fill="#8ba0b0" letter-spacing="2.5">乘势而为 · 不远而复</text>
  </g>
</svg>
