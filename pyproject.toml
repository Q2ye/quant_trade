[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant_trade"
version = "1.0.0"
description = "Quantitative Stock Selection Platform for A-share Market"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    # 核心框架
#    "vnpy>=4.1.0,<5.0.0",
    
    # 数据处理
    "pandas>=1.5.3",
    "numpy>=1.23.5",
    
    # 数据库
    "sqlalchemy>=1.4.46",
    "psycopg2-binary>=2.9.5",
    
    # 数据源 (保留A股专用源)
    "tushare>=1.2.89",
    "baostock>=0.8.9",
	
    # UI
    "pyqt5>=5.15.9",
    "qdarkstyle>=3.1",
    "qt-material>=2.14",

    # 报告与可视化
    "matplotlib>=3.7.1",
    "seaborn>=0.12.2",
    "reportlab>=4.0.4",  # PDF报告
    
    # 工具类
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "schedule>=1.2.0",
    "loguru>=0.7.0",
    
    # 通知服务
    "requests>=2.28.2"  # 钉钉/微信通知依赖
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.1",
    "pytest-cov>=4.1.0",
    "pylint>=2.17.4"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
addopts = "-v --cov=quant_platform --cov-report=html"
testpaths = ["tests"]