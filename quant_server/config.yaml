# 应用默认配置（非敏感参数）
defaults: &defaults
  system:
    name: "量化交易平台"
    version: "1.0.0"
    enable_web_socket: true
    enable_monitoring: true
    enable_health_check: true
    shutdown_timeout: 30.0
    log_level: "INFO"
  
  server:
    host: "127.0.0.1"
    port: 8080
    workers: 1
  
  engines:
    auto_start_main_engine: true
    auto_start_event_engine: true
    max_workers: 10
    queue_size: 10000
  
  modules:
    data:
      enabled: true
      auto_start: true
      dependencies: []
      config:
        data_source: "tushare"
        sync_interval: 3600
        cache_ttl: 300
        load_priority: "high"
    
    strategy:
      enabled: true
      auto_start: true
      dependencies: ["data"]
      config:
        max_strategies: 50
        enable_ai: true
        backtest_mode: "fast"
    
    backtest:
      enabled: true
      auto_start: true
      dependencies: ["strategy", "data"]
      config:
        max_workers: 4
        enable_optimization: true

# 环境配置框架
environments:
  development:
    <<: *defaults
    env: development
    config_source: env
    
  production:
    <<: *defaults
    env: production
    config_source: env