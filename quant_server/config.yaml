# 应用默认配置（非敏感参数）
defaults: &defaults
  system:
    name: "一念量化"
    version: "1.0.0"
    enable_web_socket: true
    enable_monitoring: true
    enable_health_check: true
    shutdown_timeout: 30.0
    log_level: "INFO"

  # API 安全配置（JWT 令牌等）
  api:
    ACCESS_TOKEN_EXPIRE_MINUTES: 600
    AUTH_ENABLED: false  # 是否启用令牌校验，设为 false 可跳过 JWT 验证（仅开发/测试）

  server:
    host: "127.0.0.1"
    port: 8080
    workers: 1
  
  engines:
    auto_start_main_engine: true
    auto_start_event_engine: true
    max_workers: 10
    queue_size: 10000
  
  modules:
    data:
      enabled: true
      auto_start: true
      dependencies: []
      config:
        data_source: "tushare"
        sync_interval: 3600
        cache_ttl: 300
        load_priority: "high"
        max_concurrent_research_per_user: 3
    
    strategy:
      enabled: true
      auto_start: true
      dependencies: ["data"]
      config:
        max_strategies: 50
        enable_ai: true
        backtest_mode: "fast"
    

    backtest:
      enabled: true
      auto_start: true
      dependencies: ["strategy", "data"]
      config:
        max_workers: 4
        enable_optimization: true

    trade:
      enabled: true
      auto_start: true
      dependencies: ["strategy", "data"]
      config:
        simulated_trading: true
        initial_capital: 1000000
        broker: "sim"
        risk_check_enabled: true
        stop_loss_percent: 0.05
    
    account:
      enabled: true
      auto_start: true
      dependencies: ["trade"]
      config:
        enable_multi_account: false
        account_update_interval: 60
    
    analysis:
      enabled: true
      auto_start: true
      dependencies: ["account", "strategy"]
      config:
        performance_calc_interval: 3600
        enable_attribution: true
    
    monitor:
      enabled: true
      auto_start: true
      dependencies: ["data", "strategy", "trade", "account", "analysis"]
      config:
        email_enabled: false
        dingtalk_enabled: false
        wechat_enabled: true
        alert_interval: 300

    risk:
      enabled: true
      auto_start: true
      dependencies: ["trade", "data"]
      config:
        risk_check_enabled: true        # 是否启用风控检查
        risk_check_interval: 60         # 定时巡检间隔（秒）
        risk_check_on_signal: true      # 是否在信号产生时执行风控检查
        position_risk_threshold: 0.10   # 单只持仓 PnL 偏离阈值

    market:
      enabled: true
      auto_start: true
      dependencies: ["data"]
      config: {}

    system:
      enabled: true
      auto_start: true
      dependencies: []
      config:
        access_token_expire_minutes: 600
        algorithm: "HS256"

# 环境配置框架
environments:
  development:
    <<: *defaults
    env: development
    config_source: env
    
  production:
    <<: *defaults
    env: production
    config_source: env

ENGINES:
  # ------------------------------------------------------------------
  # 共享线程池大小
  # 用于 batch_sync_data 的 ThreadPoolExecutor，所有并行类型共享
  # ------------------------------------------------------------------
  max_workers: 32

  # ------------------------------------------------------------------
  # 跨类型并发数
  # batch_sync_data 中同时并行执行的数据类型数量上限
  # 5 种类型一起提交 → 3 个先执行，2 个排队等待
  # 保守值 3（Tushare 免费版），VIP 用户可调到 5
  # ------------------------------------------------------------------
  sync_type_concurrency: 5

  # ------------------------------------------------------------------
  # 逐股并发数
  # _parallel_for_each 中同时处理的股票数量上限
  # 5000 只股票 → 每批 8 只并行 HTTP 请求
  # ------------------------------------------------------------------
  sync_stock_concurrency: 8

  # ------------------------------------------------------------------
  # Per-type 限流（Tushare 接口频次控制）
  # 以下接口有请求频率限制（financial_indicator 600次/分钟）
  # 限制为 3 并发 → 约 10次/秒 → 600次/分钟，不超限
  # key: DataType 枚举值的小写形式
  # value: 最大并发数（0 = 不限流）
  # ------------------------------------------------------------------
  sync_rate_limits:
    daily: 2                 # 日线行情（daily，800次/分钟）
    daily_basic: 2           # 每日指标（daily_basic，500次/分钟，保守2并发）
    adj_factor: 2            # 复权因子（adj_factor，500次/分钟）
    moneyflow: 2             # 个股资金流向（moneyflow，600次/分钟）
    weekly: 2                # 周线行情（weekly，400次/分钟）
    monthly: 2               # 月线行情（monthly，400次/分钟）
    etf_share: 2             # ETF份额（fund_share，500次/分钟）
    financial_indicator: 2   # 财务指标（fina_indicator_vip，600次/分钟）
    audit_opinion: 3         # 审计意见（fina_audit）
    forecast: 3              # 业绩预告（forecast）
    express: 3               # 业绩快报（express）
    dividend: 3              # 分红送股（dividend）
    business_income: 3       # 主营业务构成（fina_mainbz）
    financial_statement: 3   # 三张财务报表（income/balance/cashflow）
    managers: 3              # 管理层信息（stk_managers）
    rewards: 3               # 管理层薪酬持股（stk_rewards）
    etf_daily: 2             # ETF日线（fund_daily，800次/分钟）
    etf_adj: 2               # ETF复权因子（fund_adj，500次/分钟）
    index_daily: 1           # 指数日线（index_daily，500次/分钟）
    stk_factor: 3             # 股票技术因子（stk_factor，500次/分钟@8000积分）
    stk_factor_pro: 2         # 股票技术因子专业版（stk_factor_pro，500次/分钟@8000积分）
    idx_factor_pro: 2         # 指数技术因子专业版（idx_factor_pro，500次/分钟）
    holdernumber: 3           # 股东人数（stk_holdernumber，500次/分钟）
    top10_holders: 3           # 前十大股东（top10_holders，500次/分钟）
    top10_floatholders: 3      # 前十大流通股东（top10_floatholders，500次/分钟）
    pledge_stat: 3             # 股权质押统计（pledge_stat，500次/分钟）
    sw_daily: 3                # 申万日线行情（sw_daily，500次/分钟）