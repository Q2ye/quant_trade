# 应用默认配置（非敏感参数）
defaults: &defaults
  system:
    name: "量化交易平台"
    version: "1.0.0"
    enable_web_socket: true
    enable_monitoring: true
    enable_health_check: true
    shutdown_timeout: 30.0
    log_level: "INFO"
  
  server:
    host: "127.0.0.1"
    port: 8080
    workers: 1
  
  engines:
    auto_start_main_engine: true
    auto_start_event_engine: true
    max_workers: 10
    queue_size: 10000
  
  modules:
    data:
      enabled: true
      auto_start: true
      dependencies: []
      config:
        data_source: "tushare"
        sync_interval: 3600
        cache_ttl: 300
        load_priority: "high"
    
    strategy:
      enabled: true
      auto_start: true
      dependencies: ["data"]
      config:
        max_strategies: 50
        enable_ai: true
        backtest_mode: "fast"
    
    backtest:
      enabled: true
      auto_start: true
      dependencies: ["strategy", "data"]
      config:
        max_workers: 4
        enable_optimization: true
    
    trade:
      enabled: true
      auto_start: true
      dependencies: ["strategy", "data"]
      config:
        simulated_trading: true
        initial_capital: 1000000
        broker: "sim"
        risk_check_enabled: true
        stop_loss_percent: 0.05
    
    account:
      enabled: true
      auto_start: true
      dependencies: ["trade"]
      config:
        enable_multi_account: false
        account_update_interval: 60
    
    analysis:
      enabled: true
      auto_start: true
      dependencies: ["account", "strategy"]
      config:
        performance_calc_interval: 3600
        enable_attribution: true
    
    monitor:
      enabled: true
      auto_start: true
      dependencies: ["data", "strategy", "trade", "account", "analysis"]
      config:
        email_enabled: false
        dingtalk_enabled: false
        wechat_enabled: false
        alert_interval: 300
    
    system:
      enabled: true
      auto_start: true
      dependencies: []
      config:
        secret_key: "your-secret-key-here"
        access_token_expire_minutes: 30
        algorithm: "HS256"

# 环境配置框架
environments:
  development:
    <<: *defaults
    env: development
    config_source: env
    
  production:
    <<: *defaults
    env: production
    config_source: env