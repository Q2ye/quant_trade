# quant_server/config/main.yaml
# 数据库配置 - 使用占位符，实际值从环境变量获取
database:
  type: "${DB_TYPE:pgsql}"   # 支持 pgsql 或 mysql
  host: "${DB_HOST:localhost}"
  port: "${DB_PORT:5432}"    # PostgresSQL默认5432，MySQL默认3306
  user: "${DB_USER:postgres}"
  password: "${DB_PASSWORD:}" # 从环境变量获取，不留默认值
  name: "${DB_NAME:quant_signals}"
  pool_size: "${DB_POOL_SIZE:10}"
  max_overflow: "${DB_MAX_OVERFLOW:5}"

# 应用配置
app:
  host: "${APP_HOST:0.0.0.0}"
  port: "${APP_PORT:8000}"
  debug: "${APP_DEBUG:false}"
  log_level: "${LOG_LEVEL:INFO}"

# 数据源配置
data_sources:
  tushare:
    token: "${TUSHARE_TOKEN:}" # Tushare API token
    timeout: "${TUSHARE_TIMEOUT:30}"
  baostock:
    user: "${BAOSTOCK_USER:}"
    password: "${BAOSTOCK_PASSWORD:}"

# 通知配置
notifiers:
  email:
    enabled: "${EMAIL_ENABLED:false}"
    smtp_server: "${SMTP_SERVER:smtp.example.com}"
    smtp_port: "${SMTP_PORT:587}"
    username: "${EMAIL_USERNAME:}"
    password: "${EMAIL_PASSWORD:}"
    receivers: "${EMAIL_RECEIVERS:}"

  dingtalk:
    enabled: "${DINGTALK_ENABLED:false}"
    webhook: "${DINGTALK_WEBHOOK:}"

  wechat:
    enabled: "${WECHAT_ENABLED:false}"
    corp_id: "${WECHAT_CORP_ID:}"
    corp_secret: "${WECHAT_CORP_SECRET:}"
    agent_id: "${WECHAT_AGENT_ID:1000001}"

# 策略配置路径
strategy_config_path: "${STRATEGY_CONFIG_PATH:config/strategies}"