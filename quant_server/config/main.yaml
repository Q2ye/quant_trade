# 数据库配置
database:
  type: "pgsql"   # 支持 pgsql 或 mysql
  host: "localhost"
  port: 5432       # PostgreSQL默认5432，MySQL默认3306
  user: "postgres"
  password: "123456"
  database: "quant_signals"
  pool_size: 10    # 连接池大小
  max_overflow: 5  # 最大溢出连接数

# 通知配置
notifiers:
  email:
    smtp_server: "smtp.example.com"
    smtp_port: 587
    username: "your_email@example.com"
    password: "email_password"
    receivers:
      - "user1@example.com"
      - "user2@example.com"

  dingtalk:
    webhook: "https://oapi.dingtalk.com/robot/send?access_token=your_token"

  wechat:
    corp_id: "your_corp_id"
    corp_secret: "your_corp_secret"
    agent_id: 1000001

# 策略配置路径
strategy_config_path: "config/strategies"
